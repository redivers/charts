apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "connector.fullname" . }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the rendered token secret changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "connector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "connector.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: connector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --url
            - {{ .Values.rediver.url | quote }}
            - --data-dir
            - {{ .Values.dataDir | quote }}
          env:
            - name: REDIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "connector.secretName" . }}
                  key: REDIVER_TOKEN
            {{- if or .Values.gitlab.token .Values.existingSecret }}
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "connector.secretName" . }}
                  key: GITLAB_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.gitlab.url }}
            - name: GITLAB_URL
              value: {{ .Values.gitlab.url | quote }}
            {{- end }}
            {{- if .Values.config.workers }}
            - name: WORKERS
              value: {{ .Values.config.workers | quote }}
            {{- end }}
            {{- if .Values.config.queueSize }}
            - name: QUEUE_SIZE
              value: {{ .Values.config.queueSize | quote }}
            {{- end }}
            # Keep git's HOME on the writable data volume so it works as non-root.
            - name: HOME
              value: {{ .Values.dataDir | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.dataDir | quote }}
            {{- if .Values.securityContext.readOnlyRootFilesystem }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        # DATA_DIR is ephemeral scratch space: each sync job clones into a temp
        # subdir and deletes it when done, so nothing needs to survive a restart.
        - name: data
          emptyDir: {}
        {{- if .Values.securityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
