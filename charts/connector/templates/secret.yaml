{{- if not .Values.existingSecret -}}
{{- if not .Values.rediver.token -}}
{{- fail "rediver.token is required (or set existingSecret to reference a pre-created Secret with REDIVER_TOKEN)." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.fullname" . }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIVER_TOKEN: {{ .Values.rediver.token | quote }}
  {{- if .Values.gitlab.token }}
  GITLAB_TOKEN: {{ .Values.gitlab.token | quote }}
  {{- end }}
{{- end }}
