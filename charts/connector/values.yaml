# Default values for the Rediver Connector chart.
# This is a YAML-formatted file. Override any value with `--set` or a custom values file.

# The connector is a singleton outbound agent: each running pod registers itself
# as one connector with the Rediver backend. Run a single replica per cluster
# token unless you intend to register multiple distinct connectors.
replicaCount: 1

image:
  repository: ghcr.io/redivers/connector
  # Overrides the image tag. Defaults to the chart appVersion when empty.
  # Use "main" to track the latest dev build, or a pinned version like "2.0.0".
  tag: ""
  pullPolicy: IfNotPresent

# Secrets for pulling the image. The GHCR package is public, so this is usually empty.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Rediver backend connection.
rediver:
  # Rediver API URL (maps to REDIVER_URL).
  url: https://api.rediver.ai
  # Cluster token (maps to REDIVER_TOKEN). REQUIRED.
  # Provide it here, or reference a pre-existing secret via `existingSecret` below.
  token: ""

# Optional connector-local GitLab credential. Leave both values empty to use
# the credential supplied by Rediver. When one local value is set, both are
# required.
gitlab:
  # Personal access token with read_api + read_repository scope (maps to GITLAB_TOKEN).
  token: ""
  # GitLab base URL (maps to GITLAB_URL).
  url: ""
  # Projects fetched per GitLab API page (maps to GITLAB_PROJECTS_PER_PAGE).
  # Must be between 1 and 100.
  projectsPerPage: 50

# Use a pre-existing Kubernetes Secret instead of letting the chart create one.
# The secret must contain REDIVER_TOKEN. Add GITLAB_TOKEN when gitlab.url is set
# to use connector-local GitLab credentials.
# When set, rediver.token and gitlab.token above are ignored.
existingSecret: ""

# Connector runtime configuration.
config:
  # Maximum concurrent job executions (maps to THREADS).
  # Empty = connector default: min(CPU*2, 8).
  threads: ""
  # Minimum structured log level (maps to LOG_LEVEL).
  logLevel: info
  # Grace period before active handlers are interrupted during shutdown
  # (maps to SHUTDOWN_GRACE_SECONDS).
  shutdownGraceSeconds: 30
  # Encrypt source artifacts with AES-256-GCM before upload
  # (maps to ARTIFACT_ENCRYPTION).
  artifactEncryption: false

# Extra environment variables passed verbatim to the container.
# Each item is a standard core/v1 EnvVar.
extraEnv: []
# - name: HTTP_PROXY
#   value: http://proxy.internal:3128

# Deployment update strategy. Recreate avoids two agents registering at once
# during rollouts.
strategy:
  type: Recreate

serviceAccount:
  # Create a dedicated ServiceAccount.
  create: true
  # Name override. Generated from the release name when empty.
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  # The image's USER is the connector account (UID/GID 999). runAsNonRoot
  # enforcement can only verify a *numeric* user, so runAsUser/runAsGroup must
  # be set explicitly here — a non-numeric image USER makes the kubelet fail
  # with CreateContainerConfigError. fsGroup keeps conditional emptyDir mounts
  # writable.
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

# Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  # When enabled, the chart mounts writable emptyDir volumes at the image's
  # HOME (/home/connector) and /tmp.
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Extra pod annotations/labels.
podAnnotations: {}
podLabels: {}
